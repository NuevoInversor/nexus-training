<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f1f5f9;font:15px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:18px 14px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}h1,h2,h3,p{margin:0}h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}small,.muted{color:#a8b5c7}a{color:#a7f3d0}button,input,select,textarea{font:inherit}button,a,input,textarea,select{touch-action:manipulation}button{cursor:pointer;border:1px solid #475569;border-radius:12px;padding:10px 12px;background:#273548;color:#f1f5f9;min-height:42px}button:disabled{opacity:.5;cursor:wait}button.primary{background:#16634c;border-color:#34a77d}button[aria-pressed=true]{background:#164e3d;color:#a7f3d0;border-color:#34a77d}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #6ee7b7;outline-offset:2px}nav{display:flex;gap:7px;overflow-x:auto;margin:14px 0}nav button{flex:1;white-space:nowrap}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.card{background:#172338;border:1px solid #334155;border-radius:17px;padding:14px;margin-bottom:12px}.meal{padding:12px;margin-top:10px;border-radius:13px;background:#243247;border:1px solid #40516a}.meal.confirmed{background:#153b30;border-color:#347c60;color:#a7f3d0}.meal.modified{background:#422f19;border-color:#966b2d;color:#fde68a}.meal.cancelled{color:#fda4af}.meal-name{font-weight:700;margin:5px 0 9px;overflow-wrap:anywhere}.notes{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #475569;padding-top:8px;margin-top:8px;font-size:14px}.day-today{color:#6ee7b7}.green{color:#6ee7b7}.error{background:#481e28;color:#fecdd3;padding:12px;border-radius:12px;margin-bottom:12px}.status{font-size:13px;margin:8px 0 14px;min-height:20px}.empty{padding:14px;border:1px dashed #64748b;border-radius:12px;color:#b7c3d4}.field{display:grid;gap:5px;margin:12px 0}input,textarea,select{width:100%;background:#0f172a;color:#f1f5f9;border:1px solid #64748b;border-radius:10px;padding:11px}textarea{min-height:90px;resize:vertical}dialog{width:min(94vw,520px);max-height:90vh;overflow:auto;background:#172338;color:#f1f5f9;border:1px solid #475569;border-radius:18px;padding:20px}dialog::backdrop{background:#0009}.progress{height:7px;background:#334155;border-radius:20px;overflow:hidden;margin:8px 0 16px}.progress div{height:100%;background:#34d399}.sub{font-size:12px;color:#a8b5c7}.note-action{font-size:13px}.right{margin-left:auto}.rule{white-space:pre-wrap;overflow-wrap:anywhere}.tag{display:inline-block;font-size:12px;color:#a7f3d0;background:#164e3d;border-radius:20px;padding:4px 8px}
.meal-heading{display:flex;align-items:center;gap:4px;justify-content:space-between;margin-bottom:4px;flex-wrap:nowrap}.meal-heading-left{display:flex;align-items:center;gap:5px;flex:none}.meal-heading-left>small{font-weight:750}.meal-event-icon{display:inline-flex;align-items:center;justify-content:center;min-height:44px;width:44px;padding:0;border:1px solid transparent;background:transparent;color:#a8b5c7;border-radius:10px;flex:none}.meal-event-icon svg{width:22px;height:22px;pointer-events:none}.meal-event-icon:hover{background:#344359}.meal-event-icon[aria-pressed=true]{background:#364255;border-color:#64748b;color:#f1f5f9}.meal-event-icon[data-event="__date__"][aria-pressed=true]{color:#f9a8d4}.meal-event-icon[data-event="__away__"][aria-pressed=true]{color:#93c5fd}.meal-heading>small{text-align:right;font-size:11px}

<body><main>
<header><div><small>NEXUS · v3.07</small><h1>Nutrición</h1></div><a href="index.html?v=3.07">← Inicio</a></header>
<p id="status" class="status" role="status">Conectando con NEXUS Cloud…</p>

<dialog id="editor"><form id="form"><div class="row between"><h2 id="editorTitle"></h2><button type="button" id="close">Cerrar</button></div><div id="fields"></div><div id="formError" class="error" hidden></div><button class="primary" id="save" type="submit">Guardar</button></form></dialog>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="nexus-config-v300.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const make=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
const add=(parent,tag,text,cls)=>{const e=make(tag,text,cls);parent.append(e);return e;};
const btn=(parent,text,fn,cls)=>{const b=add(parent,'button',text,cls);b.type='button';b.onclick=fn;return b;};
const fmt=d=>new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short',timeZone:'Europe/Madrid'}).format(new Date(d+'T12:00:00Z'));
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const shift=(s,n)=>{let d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const monday=s=>shift(s,-((new Date(s+'T12:00:00Z').getUTCDay()+6)%7));
const labels={lunch:'Comida',dinner:'Cena',both:'Comida o cena'};
let week=monday(today()), tab='Menú', sb, user, recipes=[],rules=[],menus=[],items=[],notes=[],busy=false,revision=0,saveAction;
function error(e){$('error').hidden=!e;$('error').textContent=e?('No se ha podido completar la operación: '+(e.message||e)):'';}
function check(r){if(r.error)throw r.error;return r.data;}
function table(t){return sb.from('nutrition_'+t);}
function owned(t){return table(t).select('*').eq('user_id',user.id);}
function recipe(id){return recipes.find(r=>r.id===id);}
function planned(m){return m.planned_label||recipe(m.planned_recipe_id)?.name||'Plato';}
function actual(m){return m.consumed_label||recipe(m.consumed_recipe_id)?.name||planned(m);}
function menuFor(d){return menus.find(m=>m.start_date<=d&&m.end_date>=d);}
async function load(){
 if(!user)return;const rev=++revision;error(null);$('status').textContent='Actualizando…';
 try{
 const responses=await Promise.all([owned('recipes').order('name'),owned('rules').order('name'),owned('menus').order('start_date',{ascending:false}),owned('menu_items').gte('meal_date',week).lte('meal_date',shift(week,6)),owned('feedback').order('created_at',{ascending:false})]);
 if(rev!==revision)return;
 [recipes,rules,menus,items,notes]=responses.map(check);
 $('status').textContent='✓ NEXUS Cloud · Menú compartido';
 render();
 }catch(e){if(rev===revision){error(e);$('status').textContent='Sin conexión confirmada';}}
}
async function write(fn){
 if(busy)throw Error('Hay una operación en curso');
 busy=true;error(null);
 try{await fn();await load();}catch(e){error(e);throw e;}finally{busy=false;}
}
function run(fn){return async e=>{const b=e?.currentTarget;if(b)b.disabled=true;try{await write(fn);}catch(_){}finally{if(b)b.disabled=false;}};}
async function getMenu(d){
 let m=menuFor(d);if(m)return m;
 const start=monday(d),end=shift(start,6);
 // A concurrent device may create the same week first.
 const result=await table('menus').upsert({user_id:user.id,start_date:start,end_date:end,title:'Semana '+fmt(start),status:'published'},{onConflict:'user_id,start_date',ignoreDuplicates:true}).select();
 check(result);
 const existing=check(await owned('menus').eq('start_date',start).single());
 return existing;
}
function editor(title,fields,action){
 $('editorTitle').textContent=title;$('fields').replaceChildren();$('formError').hidden=true;saveAction=action;
 fields.forEach(f=>{
 const l=add($('fields'),'label',undefined,'field');add(l,'span',f.label);
 let x;
 if(f.options){x=add(l,'select');f.options.forEach(o=>{const opt=add(x,'option',o[1]);opt.value=o[0];});}
 else{x=add(l,f.type==='textarea'?'textarea':'input');if(f.type!=='textarea')x.type=f.type||'text';}
 x.name=f.name;x.value=f.value??'';x.required=!!f.required;if(f.min!==undefined)x.min=f.min;if(f.max!==undefined)x.max=f.max;if(f.placeholder)x.placeholder=f.placeholder;
 });
 $('editor').showModal();
}
$('close').onclick=()=>$('editor').close();
$('form').onsubmit=async e=>{
 e.preventDefault();if(busy)return;$('save').disabled=true;$('formError').hidden=true;
 try{const data=Object.fromEntries(new FormData(e.currentTarget));await write(()=>saveAction(data));$('editor').close();}
 catch(err){$('formError').textContent=err.message||String(err);$('formError').hidden=false;}finally{$('save').disabled=false;}
};
function isSoup(r){return !!r&&/^Sopa\b/i.test(r.name);}
function isProteinOnly(r){return !!r&&!!r.protein&&!r.carbohydrate;}
const eventLabel=v=>v==='__date__'?'Cita':v==='__away__'?'Fuera de casa':null;
function eventValue(label){return label==='Noche de cita'||label==='Cita'?'__date__':label==='Fuera de casa'?'__away__':'';}
function mealFields(type,id,sideIds,event=''){
 const mains=recipes.filter(r=>r.active&&r.dish_role==='Principal');
 const main=recipe(id);
 const sides=recipes.filter(r=>r.active&&(r.dish_role==='Acompañante'||(isSoup(main)&&isProteinOnly(r)&&r.id!==id)));
 const options=[['','Sin acompañamiento'],...sides.map(r=>[r.id,r.name+(r.dish_role==='Principal'?' · proteína':'')])];
 return [{name:'recipe',label:'Principal',options:[['','Seleccionar principal'],...mains.map(r=>[r.id,r.name])],value:id||'',required:!event},...Array.from({length:Math.max(3,sideIds.length)},(_,i)=>({name:'side'+i,label:'Acompañamiento '+(i+1),options,value:sideIds[i]||''}))];
}
function wireMealFields(){
 const main=$('fields').querySelector('[name="recipe"]');
 if(!main)return;
 function refresh(){
 const r=recipe(main.value),free=!!eventLabel(main.value);
 const opts=recipes.filter(x=>x.active&&(x.dish_role==='Acompañante'||(isSoup(r)&&isProteinOnly(x)&&x.id!==r.id)));
 $('fields').querySelectorAll('select[name^="side"]').forEach(el=>{
 const prev=el.value;el.replaceChildren();const blank=add(el,'option','Sin acompañamiento');blank.value='';
 opts.forEach(x=>{const o=add(el,'option',x.name+(x.dish_role==='Principal'?' · proteína':''));o.value=x.id;});
 el.value=opts.some(x=>x.id===prev)&&!free?prev:'';el.disabled=free;
 });
 }
 main.addEventListener('change',refresh);refresh();
}
function mealValues(v,type){
 if(eventLabel(v.recipe))return [];
 const main=recipe(v.recipe),sides=[...new Set(Object.entries(v).filter(([k,x])=>/^side\d+$/.test(k)&&x).map(([k,x])=>x))];
 if(!main?.active||main.dish_role!=='Principal')throw Error('Selecciona un plato principal del recetario.');
 if(main.requires_accompaniment&&!sides.length)throw Error('Este principal necesita acompañamiento.');
 if(sides.some(id=>{const r=recipe(id);return !r?.active||!(r.dish_role==='Acompañante'||(isSoup(main)&&isProteinOnly(r)&&r.id!==main.id));}))throw Error('Selecciona acompañamientos del recetario.');
 if(type==='lunch'&&isSoup(main)&&!sides.some(id=>isProteinOnly(recipe(id))))throw Error('La sopa a mediodía necesita un acompañamiento proteico sin hidrato principal.');
 return sides;
}
function chooseRecipe(d,type,m){
 const recorded=!!m&&['confirmed','modified'].includes(m.status);
 const modified=m?.status==='modified';
 const id=modified?m.consumed_recipe_id:m?.planned_recipe_id;
 const label=modified?m.consumed_label:m?.planned_label;
 const sidesBefore=modified?(m.consumed_accompaniment_ids||[]):(m?.planned_accompaniment_ids||[]);
 const existingNotes=m?notes.filter(n=>n.menu_item_id===m.id):[];
 const fields=mealFields(type,id,sidesBefore,eventValue(m?.planned_label)==='__date__'?'__date__':'');
 existingNotes.forEach((n,i)=>fields.push({name:'existing_note_'+i,label:'Nota '+(i+1)+(n.reviewed?' (revisada)':''),type:'textarea',value:n.note}));
 fields.push({name:'new_note',label:'Añadir nota (opcional)',type:'textarea',placeholder:'Observaciones para próximos menús'});
 editor(m?'Editar '+labels[type].toLowerCase():'Planificar '+labels[type].toLowerCase(),fields,async v=>{
 const date=eventValue(m?.planned_label)==='__date__';
 const sides=date&&!v.recipe?[]:mealValues(v,type),free=date?'Cita':null;
 const row={planned_recipe_id:v.recipe||null,planned_label:free,planned_accompaniment_ids:sides};
 let saved=m;
 if(recorded){
 const same=(id||null)===row.planned_recipe_id&&((eventValue(label)||'')===(eventValue(free)||''))&&[...sidesBefore].sort().join(',')===[...sides].sort().join(',');
 if(!same)await setMeal(m,'modified',{consumed_recipe_id:row.planned_recipe_id,consumed_label:free,consumed_accompaniment_ids:sides})();
 }else if(m){
 if(m.planned_recipe_id!==row.planned_recipe_id){row.batch_id=null;row.batch_action=null;}
 if(m.status==='cancelled')Object.assign(row,{status:'pending',confirmed_at:null,consumed_recipe_id:null,consumed_label:null,consumed_accompaniment_ids:[]});
 saved=check(await table('menu_items').update(row).eq('user_id',user.id).eq('id',m.id).eq('status',m.status).select().single());
 }else{
 const menu=await getMenu(d);
 saved=check(await table('menu_items').insert({...row,user_id:user.id,menu_id:menu.id,meal_date:d,meal_type:type}).select().single());
 }
 for(let i=0;i<existingNotes.length;i++){
 const n=existingNotes[i],note=(v['existing_note_'+i]||'').trim();
 if(note&&note!==n.note)check(await table('feedback').update({note,reviewed:false,reviewed_at:null,resolution:null}).eq('user_id',user.id).eq('id',n.id).select().single());
 }
 const note=(v.new_note||'').trim();
 if(note)check(await table('feedback').insert({user_id:user.id,menu_id:saved.menu_id,menu_item_id:saved.id,recipe_id:row.planned_recipe_id,scope:'meal',week_start:null,note}).select().single());
 });wireMealFields();
}
function setMeal(m,status,other={}){
 return async()=>check(await table('menu_items').update({status,confirmed_at:status==='pending'?null:new Date().toISOString(),consumed_recipe_id:status==='confirmed'?m.planned_recipe_id:null,consumed_label:status==='confirmed'?m.planned_label:null,consumed_accompaniment_ids:status==='confirmed'?(m.planned_accompaniment_ids||[]):[],...other}).eq('user_id',user.id).eq('id',m.id).select().single());
}
function editNote({m,n,scope='meal'}){
 editor(n?'Editar nota':'Añadir nota',[{name:'note',label:'Observaciones para próximos menús',type:'textarea',required:true,value:n?.note||'',placeholder:'¿Qué cambiaríamos la próxima vez?'}],async v=>{
 const note=v.note.trim();if(!note)throw Error('Escribe una observación.');
 if(n){check(await table('feedback').update({note,reviewed:false,reviewed_at:null,resolution:null}).eq('user_id',user.id).eq('id',n.id).select().single());return;}
 const menu=m?{id:m.menu_id}:await getMenu(week);
 check(await table('feedback').insert({user_id:user.id,menu_id:menu.id,menu_item_id:m?.id||null,recipe_id:m?(m.consumed_recipe_id||m.planned_recipe_id):null,scope,week_start:scope==='week'?week:null,note}).select().single());
 });
}
function showNotes(p,list,m){
 list.forEach(n=>{const x=add(p,'div',undefined,'notes');add(x,'p',n.note);const row=add(x,'div',undefined,'row');add(row,'small',n.reviewed?'Revisada':'Pendiente de revisión');btn(row,'Editar',()=>editNote({m,n}),'note-action right');});
}
function mealEventButton(parent,event,selected,action){
 const isDate=event==='__date__',label=isDate?'Cita':'Fuera de casa';
 const b=btn(parent,'',action,'meal-event-icon');b.dataset.event=event;b.title=label;b.setAttribute('aria-label',label);b.setAttribute('aria-pressed',String(selected));
 b.innerHTML=isDate?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17v4H3V10l9-7 9 7v3"/><path d="M13 17h9m-4-4 4 4-4 4"/></svg>';
 return b;
}
async function registerMealEvent(d,type,m,event){
 const date=eventValue(m?.planned_label)==='__date__',away=eventValue(m?.consumed_label)==='__away__'||eventValue(m?.planned_label)==='__away__';
 const reset={status:'pending',confirmed_at:null,consumed_recipe_id:null,consumed_label:null,consumed_accompaniment_ids:[]};
 if(m){
 let row;
 if(event==='__date__'){
 if(!date){
 const existing=items.find(x=>x.id!==m.id&&eventValue(x.planned_label)==='__date__');
 if(existing)throw Error('Ya hay una cita activa esta semana ('+fmt(existing.meal_date)+' · '+labels[existing.meal_type]+'). Desmarca primero su corazón.');
 }
 if(date){
 const original=m.date_original_plan;
 row={...reset,planned_recipe_id:original?.planned_recipe_id||null,planned_label:original?.planned_label||(!original?.planned_recipe_id?'Sin planificar':null),planned_accompaniment_ids:original?.planned_accompaniment_ids||[],batch_id:original?.batch_id||null,batch_action:original?.batch_action||null,date_original_plan:null};
 }else{
 row={...reset,planned_recipe_id:null,planned_label:'Cita',planned_accompaniment_ids:[],batch_id:null,batch_action:null,date_original_plan:{planned_recipe_id:m.planned_recipe_id,planned_label:m.planned_label,planned_accompaniment_ids:m.planned_accompaniment_ids||[],batch_id:m.batch_id,batch_action:m.batch_action}};
 }
 }else if(away){
 row={...reset};if(eventValue(m.planned_label)==='__away__')row.planned_label='Sin planificar';
 }else{
 row={status:'modified',confirmed_at:new Date().toISOString(),consumed_recipe_id:null,consumed_label:'Fuera de casa',consumed_accompaniment_ids:[]};
 }
 check(await table('menu_items').update(row).eq('user_id',user.id).eq('id',m.id).select().single());
 }else{
 if(event==='__date__'){const existing=items.find(x=>eventValue(x.planned_label)==='__date__');if(existing)throw Error('Ya hay una cita activa esta semana ('+fmt(existing.meal_date)+' · '+labels[existing.meal_type]+'). Desmarca primero su corazón.');}
 const menu=await getMenu(d),row={user_id:user.id,menu_id:menu.id,meal_date:d,meal_type:type,planned_label:event==='__date__'?'Cita':'Sin planificar'};
 if(event==='__away__')Object.assign(row,{status:'modified',confirmed_at:new Date().toISOString(),consumed_label:'Fuera de casa'});
 check(await table('menu_items').insert(row).select().single());
 }
}
function showMeal(parent,d,type){
 const m=items.find(x=>x.meal_date===d&&x.meal_type===type);
 const date=eventValue(m?.planned_label)==='__date__',away=eventValue(m?.consumed_label)==='__away__'||eventValue(m?.planned_label)==='__away__';
 const recorded=!!m&&['confirmed','modified'].includes(m.status);
 const neutral=away||(date&&!recorded);
 const box=add(parent,'div',undefined,'meal '+(neutral?'':m?.status||''));
 const top=add(box,'div',undefined,'meal-heading'),left=add(top,'div',undefined,'meal-heading-left');add(left,'small',labels[type]);
 mealEventButton(left,'__date__',date,run(()=>registerMealEvent(d,type,m,'__date__')));
 mealEventButton(left,'__away__',away,run(()=>registerMealEvent(d,type,m,'__away__')));
 if(!m){add(top,'small','Pendiente');add(box,'small','Principal');add(box,'p','—','meal-name');add(box,'small','Acompañamientos');add(box,'p','—','meal-name');btn(box,'Editar',()=>chooseRecipe(d,type));return;}
 const state={pending:'Pendiente',confirmed:'✓ Confirmada',modified:'↻ Modificada',cancelled:'× Cancelada'};
 add(top,'small',away?'Fuera de casa':state[m.status]);
 if(away){
 add(box,'p','Fuera de casa','meal-name');
 btn(box,'Notas',()=>editNote({m}));
 showNotes(box,notes.filter(n=>n.menu_item_id===m.id),m);
 return;
 }
 const rid=m.status==='modified'?m.consumed_recipe_id:m.planned_recipe_id;
 const sideIds=m.status==='modified'?(m.consumed_accompaniment_ids||[]):(m.planned_accompaniment_ids||[]);
 add(box,'small','Principal');add(box,'p',recipe(rid)?.name||'—','meal-name');
 add(box,'small','Acompañamientos');add(box,'p',sideIds.length?sideIds.map(id=>recipe(id)?.name||'Receta no disponible').join(' · '):'—','meal-name');
 if(m.status==='modified'&&!date)add(box,'small','Previsto: '+[recipe(m.planned_recipe_id)?.name||'Sin planificar',...(m.planned_accompaniment_ids||[]).map(id=>recipe(id)?.name||'Receta no disponible')].join(' · '));
 const r=recipe(rid);if(m.batch_action&&r)add(box,'span',m.batch_action==='prepare'?'Batch cooking · preparar':'Batch cooking · segunda toma','tag');else if(r?.sessions>1)add(box,'span',r.sessions+' raciones','tag');
 const actions=add(box,'div',undefined,'row');
 if(m.status==='pending'){const confirm=btn(actions,'✓ Confirmar',run(setMeal(m,'confirmed')),'primary');confirm.disabled=!rid&&!date;}
 else btn(actions,'Deshacer',run(setMeal(m,'pending')));
 btn(actions,'Editar',()=>chooseRecipe(d,type,m));
 const mealNotes=notes.filter(n=>n.menu_item_id===m.id);
 if(mealNotes.length){const summary=add(box,'small','Notas: '+mealNotes.length,'muted');summary.style.display='block';summary.style.marginTop='8px';}
}
function renderWeek(p){
 const row=add(p,'div',undefined,'row between');
 btn(row,'‹',()=>{week=shift(week,-7);load();});
 add(row,'h2',fmt(week)+' – '+fmt(shift(week,6)));
 btn(row,'›',()=>{week=shift(week,7);load();});
 btn(p,'Semana actual',()=>{week=monday(today());load();});
 const plannedMeals=items.filter(x=>eventValue(x.consumed_label)!=='__away__'&&eventValue(x.planned_label)!=='__away__'&&(x.planned_recipe_id||x.consumed_recipe_id));
 const count=plannedMeals.filter(x=>['confirmed','modified'].includes(x.status)&&x.consumed_recipe_id).length;
 const events=items.filter(x=>eventValue(x.consumed_label)&&['confirmed','modified'].includes(x.status)).length;
 add(p,'p',count+' de '+plannedMeals.length+' comidas en casa confirmadas · '+events+' citas/salidas registradas','status');
 const prog=add(p,'div',undefined,'progress');add(prog,'div').style.width=(plannedMeals.length?100*count/plannedMeals.length:0)+'%';
 for(let i=0;i<5;i++){
 const d=shift(week,i),card=add(p,'article',undefined,'card');
 const name=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Madrid'}).format(new Date(d+'T12:00:00Z'));
 add(card,'h3',name+(d===today()?' · Hoy':''),d===today()?'day-today':'');showMeal(card,d,'lunch');showMeal(card,d,'dinner');
 }
 const box=add(p,'article',undefined,'card');add(box,'h3','Observaciones semanales');btn(box,'＋ Añadir nota semanal',()=>editNote({scope:'week'}));showNotes(box,notes.filter(n=>n.scope==='week'&&n.week_start===week));
}
function recipeEditor(r){
 const opts=(arr,blank=false)=>[...(blank?[['','Sin asignar']]:[]),...arr.map(x=>[x,x])];
 editor(r?'Editar receta':'Nueva receta',[
 {name:'name',label:'Nombre del plato',required:true,value:r?.name},
 {name:'dish_role',label:'Etiqueta',options:opts(['Principal','Acompañante']),value:r?.dish_role||'Principal'},
 {name:'requires_accompaniment',label:'¿Necesita acompañamiento?',options:[['','Sin definir'],['true','Sí'],['false','No']],value:r?.requires_accompaniment==null?'':String(r.requires_accompaniment)},
 {name:'meal_type',label:'Momento del día',options:[['lunch','Comida'],['dinner','Cena'],['both','Ambas']],value:r?.meal_type||'both'},
 {name:'category',label:'Categoría',options:opts(['Legumbre','Hidratos','Carne','Pescado','Sandwich','Verdura','Crema','Otro'],true),value:r?.category||'',required:true},
 {name:'protein',label:'Proteína principal',options:opts(['Carne - Pollo','Carne - Ternera','Carne - Pavo','Pescado - Blanco','Pescado - Azul','Pescado - Calamares','Legumbres','Huevo'],true),value:r?.protein||''},
 {name:'carbohydrate',label:'Hidrato principal',options:opts(['Arroz','Pasta','Cuscús','Quinoa','Noodles','Patatas','Legumbres','Ñoquis','Pan'],true),value:r?.carbohydrate||''},
 {name:'sessions',label:'Raciones (ocasiones de consumo para ambos)',options:[['1','1'],['2','2'],['3','3']],value:String(r?.sessions||1)},
 {name:'periodicity',label:'Periodicidad',options:opts(['Alta','Media','Baja']),value:r?.periodicity||'Media'},
 {name:'recipe_url',label:'Link receta (opcional)',type:'url',value:r?.recipe_url},
 {name:'notes',label:'Notas',type:'textarea',value:r?.notes}
 ],async v=>{
 if(!v.name.trim())throw Error('Indica un nombre.');
 const payload={name:v.name.trim(),dish_role:v.dish_role,requires_accompaniment:v.dish_role==='Acompañante'?null:v.requires_accompaniment==='true',meal_type:v.meal_type,category:v.category,protein:v.protein||null,carbohydrate:v.carbohydrate||null,sessions:Number(v.sessions),periodicity:v.periodicity,recipe_url:v.recipe_url.trim()||null,notes:v.notes.trim()||null};
 if(payload.recipe_url&&!/^https?:\/\//i.test(payload.recipe_url))throw Error('Usa una URL http o https.');
 if(r)check(await table('recipes').update(payload).eq('user_id',user.id).eq('id',r.id).select().single());else check(await table('recipes').insert({...payload,user_id:user.id}).select().single());
 });
 const role=$('fields').querySelector('[name="dish_role"]'),accomp=$('fields').querySelector('[name="requires_accompaniment"]');
 const update=()=>{accomp.disabled=role.value==='Acompañante';accomp.required=!accomp.disabled;if(accomp.disabled)accomp.value='';};
 role.addEventListener('change',update);update();
}
function renderRecipes(p){
 const active=recipes.filter(r=>r.active);
 const top=add(p,'div',undefined,'row between');add(top,'h2','Recetario ('+active.length+')');btn(top,'＋ Receta',()=>recipeEditor(),'primary');
 const q=add(p,'input');q.placeholder='Buscar receta…';q.setAttribute('aria-label','Buscar receta');
 const filter=add(p,'select');filter.setAttribute('aria-label','Etiqueta');[['','Todas las etiquetas'],['Principal','Principales'],['Acompañante','Acompañantes']].forEach(([v,l])=>{const o=add(filter,'option',l);o.value=v;});
 const list=add(p,'div');function draw(){list.replaceChildren();active.filter(r=>(!filter.value||r.dish_role===filter.value)&&r.name.toLocaleLowerCase('es').includes(q.value.toLocaleLowerCase('es'))).forEach(r=>{
 const c=add(list,'article',undefined,'card');add(c,'h3',r.name);add(c,'p',[r.dish_role,labels[r.meal_type],r.category].filter(Boolean).join(' · '),'muted');
 add(c,'p',r.sessions+' '+(r.sessions===1?'ración':'raciones')+' · Periodicidad '+(r.periodicity||'Media'),r.sessions>1?'green':'muted');
 if(r.dish_role==='Principal')add(c,'p','Acompañamiento: '+(r.requires_accompaniment==null?'Sin definir':r.requires_accompaniment?'Sí':'No'),'muted');
 if(r.protein||r.carbohydrate)add(c,'p',[r.protein,r.carbohydrate].filter(Boolean).join(' · '),'muted');
 if(r.notes)add(c,'p',r.notes,'notes');if(r.recipe_url&&/^https?:\/\//i.test(r.recipe_url)){const a=add(c,'a','Ver receta');a.href=r.recipe_url;a.target='_blank';a.rel='noopener noreferrer';}btn(c,'Editar',()=>recipeEditor(r));});}q.oninput=draw;filter.onchange=draw;draw();
}
function renderRules(p){add(p,'h2','Reglas de planificación');rules.forEach(r=>{const c=add(p,'article',undefined,'card');add(c,'h3',r.name);add(c,'p',r.description,'rule');add(c,'small',r.active?'Activa':'Inactiva');});}
function renderHistory(p){
 add(p,'h2','Histórico y observaciones');if(!menus.length)add(p,'p','Todavía no hay menús guardados.','empty');
 menus.forEach(m=>{const c=add(p,'article',undefined,'card');add(c,'h3',m.title||'Menú');add(c,'p',fmt(m.start_date)+' – '+fmt(m.end_date),'muted');btn(c,'Abrir semana',()=>{week=monday(m.start_date);tab='Menú';load();});});
 add(p,'h2','Notas pendientes');const pending=notes.filter(n=>!n.reviewed);if(!pending.length)add(p,'p','No hay notas pendientes.','empty');
 pending.forEach(n=>{const c=add(p,'article',undefined,'card');add(c,'small',fmt(n.created_at.slice(0,10))+' · '+({meal:'Comida/cena',week:'Semana',month:'Mes'}[n.scope]));add(c,'p',n.note,'notes');btn(c,'Editar',()=>editNote({n}));btn(c,'Revisar',()=>editor('Revisar observación',[{name:'resolution',label:'Decisión tomada',type:'textarea',required:true}],async v=>{if(!v.resolution.trim())throw Error('Escribe la decisión.');check(await table('feedback').update({reviewed:true,reviewed_at:new Date().toISOString(),resolution:v.resolution.trim()}).eq('user_id',user.id).eq('id',n.id).select().single());}));});
}
function render(){
 const nav=$('tabs');nav.hidden=false;nav.replaceChildren();['Menú','Recetas','Reglas','Histórico'].forEach(t=>{const b=btn(nav,t,()=>{tab=t;render();});b.setAttribute('aria-pressed',String(tab===t));});
 const p=$('content');p.replaceChildren();({Menú:renderWeek,Recetas:renderRecipes,Reglas:renderRules,Histórico:renderHistory}[tab])(p);
}
async function init(){
 try{
 if(!window.supabase||!window.NEXUS_CLOUD)throw Error('Configuración de NEXUS Cloud no disponible');
 sb=window.supabase.createClient(window.NEXUS_CLOUD.url,window.NEXUS_CLOUD.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const session=check(await sb.auth.getSession());user=session.session?.user;
 if(!user){
 $('status').textContent='Inicia sesión en NEXUS Cloud para acceder al menú compartido.';
 btn($('auth'),'Continuar con GitHub',async()=>{try{check(await sb.auth.signInWithOAuth({provider:'github',options:{redirectTo:new URL('index.html',location.href).href}}));}catch(e){error(e);}},'primary');
 add($('auth'),'p','Después de iniciar sesión, vuelve a pulsar Nutrición.','muted');return;
 }
 sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){location.replace('index.html?v=3.07');}});
 await load();
 }catch(e){error(e);$('status').textContent='No se ha podido conectar.';}
}
init();
})();
</script></body></html>
