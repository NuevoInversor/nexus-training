name: Release Nexus v2.60

on:
  push:
    paths:
      - '.github/workflows/release-v260.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load Ana progression and bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          VERSION='v2.60'
          STAMP='11/09/2026 11:00:00'

          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'<title>Nexus Training v[^<]+</title>', f'<title>Nexus Training {VERSION}</title>', s)
          s=re.sub(r'<div class="version">Training - v[^<]+</div>', f'<div class="version">Training - {VERSION} ({STAMP})</div>', s)
          s=re.sub(r'nexus-config\.js\?v=[0-9.]+', 'nexus-config.js?v=2.60', s)
          s=re.sub(r'cloud-v27\.js\?v=[0-9.]+', 'cloud-v27.js?v=2.60', s)
          p.write_text(s)

          p=Path('nexus-config.js')
          s=p.read_text()
          s=re.sub(r"const VERSION='v[0-9.]+';", "const VERSION='v2.60';", s)
          s=re.sub(r"const STAMP='[^']+';", f"const STAMP='{STAMP}';", s)
          s=s.replace('V259','V260').replace('v2.59','v2.60').replace('v=2.59','v=2.60')
          if 'data-nexus-ana-progression' not in s:
              s=s.replace(
                  "const loadAnaPlan=()=>load('ana-plan-v216.js?v=2.60','data-nexus-ana-plan','v2.60');",
                  "const loadAnaProgression=()=>load('ana-progression-v260.js?v=2.60','data-nexus-ana-progression','v2.60');\n  const loadAnaPlan=()=>load('ana-plan-v216.js?v=2.60','data-nexus-ana-plan','v2.60',loadAnaProgression);"
              )
          p.write_text(s)

          for fn in ['polar-intelligence-v222.js','workout-completion-v244.js','cardio-persistence-v245.js','home-dashboard-v227.js','ui-hotfix-v250.js','ui-final-v252.js','strength-polar-v253.js']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text()
              s=re.sub(r"const VERSION='v[0-9.]+';", "const VERSION='v2.60';", s)
              s=re.sub(r"const STAMP='[^']+';", f"const STAMP='{STAMP}';", s)
              s=s.replace('V259','V260').replace("'v2.59'", "'v2.60'").replace('?v=2.59','?v=2.60')
              p.write_text(s)
          PY

      - name: Commit release
        run: |
          git config user.name "Nexus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html nexus-config.js ana-progression-v260.js polar-intelligence-v222.js workout-completion-v244.js cardio-persistence-v245.js home-dashboard-v227.js ui-hotfix-v250.js ui-final-v252.js strength-polar-v253.js
          git commit -m "Apply Ana week 2-3 progression v2.60" || exit 0
          git push origin main
