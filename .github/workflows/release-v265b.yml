name: Release Nexus v2.65 corrected

on:
  push:
    paths:
      - '.github/workflows/release-v265b.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.65 release
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          OLD_VERSION='v2.64'
          NEW_VERSION='v2.65'
          OLD_STAMP='14/09/2026 18:50:00'
          NEW_STAMP='15/09/2026 15:57:00'

          for p in [Path('index.html'), *Path('.').glob('*.js')]:
              if not p.exists():
                  continue
              text=p.read_text(encoding='utf-8')
              new=text.replace(OLD_VERSION,NEW_VERSION).replace('?v=2.64','?v=2.65').replace(OLD_STAMP,NEW_STAMP)
              if new!=text:
                  p.write_text(new,encoding='utf-8')

          p=Path('polar-intelligence-v222.js')
          text=p.read_text(encoding='utf-8')
          marker="  function buildReadiness(latest){\n"
          helpers=base64.b64decode('').decode('utf-8')
          if marker not in text:
              raise SystemExit('buildReadiness marker not found')
          if 'function weightedLoad(sessions)' not in text:
              text=text.replace(marker,helpers+marker,1)

          old_load=base64.b64decode('').decode('utf-8')
          new_load=base64.b64decode('').decode('utf-8')
          if old_load not in text:
              raise SystemExit('old load block not found')
          text=text.replace(old_load,new_load,1)

          old_detail=base64.b64decode('ICAgICAgPC9kaXY+CiAgICAgIDxkaXYgY2xhc3M9XCJuZXh1cy1yZWFkaW5lc3MtZGV0YWlsXCI+JHt0cmVuZH0gTGEgaW50ZXJwcmV0YWNpw7NuIE5leHVzIGNvbWJpbmEgdGVuZGVuY2lhLCBjYXJnYSB5IGRhdG9zIGRlIFBvbGFyOyBubyBjYW1iaWEgZWwgcGxhbiBhdXRvbcOhdGljYW1lbnRlLjwvZGl2Pgo=').decode('utf-8')
          new_detail=base64.b64decode('').decode('utf-8')
          if old_detail not in text:
              raise SystemExit('readiness detail block not found')
          text=text.replace(old_detail,new_detail,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Commit release
        run: |
          git config user.name "Nexus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html *.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Weight training load by activity type v2.65"
          git push
