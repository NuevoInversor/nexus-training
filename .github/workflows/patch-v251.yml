name: Patch Nexus v2.51

on:
  push:
    paths:
      - '.github/workflows/patch-v251.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch root app and version writers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION='v2.51'
          STAMP='04/09/2026 12:28:00'

          # Root HTML: make the current version/cache key part of the document itself,
          # and make Pilates native instead of depending on a late hotfix.
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'<title>Nexus Training v[^<]+</title>', f'<title>Nexus Training {VERSION}</title>', s)
          s=re.sub(r'<div class="version">Training - v[^<]+</div>', f'<div class="version">Training - {VERSION} ({STAMP})</div>', s)
          s=re.sub(r'nexus-config\.js\?v=[0-9.]+', 'nexus-config.js?v=2.51', s)
          s=re.sub(r'cloud-v27\.js\?v=[0-9.]+', 'cloud-v27.js?v=2.51', s)
          s=s.replace("pilates:{icon:'pilates', cls:'purple', label:'Pilates'}", "pilates:{icon:'pilates', cls:'pilates', label:'Pilates'}")
          s=s.replace("elliptical:{icon:'elliptical', cls:'green', label:'Elíptica'}", "elliptical:{icon:'elliptical', cls:'elliptical', label:'Elíptica'}")
          if '.activity-chip.pilates{' not in s:
              s=s.replace('.activity-chip.hike{background:#dcfce7;color:#166534}', '.activity-chip.hike{background:#dcfce7;color:#166534}\n.activity-chip.pilates{background:#ede9fe;color:#7c3aed}\n.activity-chip.elliptical{background:#dcfce7;color:#166534}')
          old='''pilates: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="M12 7v5"/><path d="M7 10c2 1 3 2 5 2s3-1 5-2"/><path d="M8 20c1.4-3.2 2.7-5 4-5s2.6 1.8 4 5"/><path d="M5 20h14"/></svg>`,'''
          new='''pilates: `<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.3" cy="6" r="1.6"/><path d="M8.5 8.2c1.1 1 1.8 2.3 2.1 3.8"/><path d="M9.1 9.6c2 .9 4.2.5 6.3-.7"/><path d="M15.4 8.9l2.2-1.2"/><path d="M10.5 12.1c.9 1.7 2 2.8 3.6 3.6"/><path d="M14.1 15.7l5-7.1"/><path d="M14 15.8l5.9-2.1"/><path d="M6.2 18.7c1.2-2.3 2.5-3.7 4.1-4.5"/><path d="M5 19h14"/></svg>`,'''
          s=s.replace(old,new)
          p.write_text(s)

          # Central loader/version lock.
          p=Path('nexus-config.js')
          s=p.read_text()
          s=re.sub(r"const VERSION='v[0-9.]+';", "const VERSION='v2.51';", s)
          s=re.sub(r"const STAMP='[^']+';", "const STAMP='04/09/2026 12:28:00';", s)
          s=s.replace('__nexusVersionLockV250','__nexusVersionLockV251')
          s=re.sub(r'\?v=2\.50', '?v=2.51', s)
          s=s.replace("'v2.50'", "'v2.51'")
          p.write_text(s)

          # Any module that still owns a version string must agree with the root.
          for fn in ['polar-intelligence-v222.js','workout-completion-v244.js','cardio-persistence-v245.js','home-dashboard-v227.js']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text()
              s=re.sub(r"const VERSION='v[0-9.]+';", "const VERSION='v2.51';", s)
              s=re.sub(r"const STAMP='[^']+';", "const STAMP='04/09/2026 12:28:00';", s)
              p.write_text(s)

          # Hotfix remains as a safety net, but native index rendering is now authoritative.
          p=Path('ui-hotfix-v250.js')
          if p.exists():
              s=p.read_text().replace('__pilatesV250','__pilatesV251').replace('nexusUiHotfixV250Style','nexusUiHotfixV251Style')
              p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "Nexus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html nexus-config.js polar-intelligence-v222.js workout-completion-v244.js cardio-persistence-v245.js home-dashboard-v227.js ui-hotfix-v250.js
          git commit -m "Fix root cache, version flash and Pilates icon v2.51" || exit 0
          git push origin main
