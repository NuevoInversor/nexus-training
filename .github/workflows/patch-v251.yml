name: Patch Nexus v2.52

on:
  push:
    paths:
      - '.github/workflows/patch-v251.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch root app and all version writers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION='v2.52'
          STAMP='04/09/2026 12:36:00'

          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'<title>Nexus Training v[^<]+</title>', f'<title>Nexus Training {VERSION}</title>', s)
          s=re.sub(r'<div class="version">Training - v[^<]+</div>', f'<div class="version">Training - {VERSION} ({STAMP})</div>', s)
          s=re.sub(r'nexus-config\.js\?v=[0-9.]+', 'nexus-config.js?v=2.52', s)
          s=re.sub(r'cloud-v27\.js\?v=[0-9.]+', 'cloud-v27.js?v=2.52', s)
          s=s.replace("pilates:{icon:'pilates', cls:'purple', label:'Pilates'}", "pilates:{icon:'pilates', cls:'pilates', label:'Pilates'}")
          s=s.replace("elliptical:{icon:'elliptical', cls:'green', label:'Elíptica'}", "elliptical:{icon:'elliptical', cls:'elliptical', label:'Elíptica'}")
          if '.activity-chip.pilates{' not in s:
              s=s.replace('.activity-chip.hike{background:#dcfce7;color:#166534}', '.activity-chip.hike{background:#dcfce7;color:#166534}\n.activity-chip.pilates{background:#ede9fe;color:#7c3aed}\n.activity-chip.elliptical{background:#dcfce7;color:#166534}')
          # Give the activity detail badge the activity class too.
          s=s.replace('<span class="history-badge">${svgIcon(visual.icon)} ${visual.label}</span>', '<span class="history-badge ${visual.cls}">${svgIcon(visual.icon)} ${visual.label}</span>')
          p.write_text(s)

          # Align every module that can repaint the visible version.
          for fn in ['nexus-config.js','polar-intelligence-v222.js','workout-completion-v244.js','cardio-persistence-v245.js','home-dashboard-v227.js','ui-hotfix-v250.js','ui-final-v252.js']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text()
              s=re.sub(r"const VERSION='v[0-9.]+';", "const VERSION='v2.52';", s)
              s=re.sub(r"const STAMP='[^']+';", "const STAMP='04/09/2026 12:36:00';", s)
              s=re.sub(r'\?v=2\.(?:50|51)', '?v=2.52', s)
              s=s.replace("'v2.50'", "'v2.52'").replace("'v2.51'", "'v2.52'")
              p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "Nexus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html nexus-config.js polar-intelligence-v222.js workout-completion-v244.js cardio-persistence-v245.js home-dashboard-v227.js ui-hotfix-v250.js ui-final-v252.js
          git commit -m "Fix Pilates rendering and version writers v2.52" || exit 0
          git push origin main
