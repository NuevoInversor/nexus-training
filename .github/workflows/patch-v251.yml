name: Patch Nexus v2.54

on:
  push:
    paths:
      - '.github/workflows/patch-v251.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch root cache and version writers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION='v2.54'
          STAMP='04/09/2026 13:24:00'

          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'<title>Nexus Training v[^<]+</title>', f'<title>Nexus Training {VERSION}</title>', s)
          s=re.sub(r'<div class="version">Training - v[^<]+</div>', f'<div class="version">Training - {VERSION} ({STAMP})</div>', s)
          s=re.sub(r'nexus-config\.js\?v=[0-9.]+', 'nexus-config.js?v=2.54', s)
          s=re.sub(r'cloud-v27\.js\?v=[0-9.]+', 'cloud-v27.js?v=2.54', s)
          p.write_text(s)

          for fn in ['nexus-config.js','polar-intelligence-v222.js','workout-completion-v244.js','cardio-persistence-v245.js','home-dashboard-v227.js','ui-hotfix-v250.js','ui-final-v252.js','strength-polar-v253.js']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text()
              s=re.sub(r"const VERSION='v[0-9.]+';", "const VERSION='v2.54';", s)
              s=re.sub(r"const STAMP='[^']+';", "const STAMP='04/09/2026 13:24:00';", s)
              s=re.sub(r'\?v=2\.(?:50|51|52|53)', '?v=2.54', s)
              for old in ['v2.50','v2.51','v2.52','v2.53']:
                  s=s.replace(f"'{old}'", "'v2.54'")
              p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "Nexus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html nexus-config.js polar-intelligence-v222.js workout-completion-v244.js cardio-persistence-v245.js home-dashboard-v227.js ui-hotfix-v250.js ui-final-v252.js strength-polar-v253.js
          git commit -m "Fix strength duplicate reconciliation v2.54" || exit 0
          git push origin main
