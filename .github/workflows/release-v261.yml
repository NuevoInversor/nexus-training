name: Release Nexus v2.61

on:
  push:
    paths:
      - '.github/workflows/release-v261.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Lower B progression to current Ana cycle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION='v2.61'
          STAMP='11/09/2026 11:00:00'

          p=Path('ana-progression-v260.js')
          s=p.read_text()
          needle="  };\n  const ORDER={"
          repl="  };\n  // Ana no completa necesariamente las cuatro rutinas dentro de una semana natural.\n  // Lower B usa ya en semana 2 la progresión definida para su próxima vuelta,\n  // sin modificar el entrenamiento ya guardado.\n  Object.assign(T['2'],T['3']);\n  const ORDER={"
          if "Object.assign(T['2'],T['3']);" not in s:
              s=s.replace(needle,repl,1)
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'<title>Nexus Training v[^<]+</title>', f'<title>Nexus Training {VERSION}</title>', s)
          s=re.sub(r'<div class="version">Training - v[^<]+</div>', f'<div class="version">Training - {VERSION} ({STAMP})</div>', s)
          s=re.sub(r'nexus-config\.js\?v=[0-9.]+', 'nexus-config.js?v=2.61', s)
          s=re.sub(r'cloud-v27\.js\?v=[0-9.]+', 'cloud-v27.js?v=2.61', s)
          p.write_text(s)

          p=Path('nexus-config.js')
          s=p.read_text()
          s=re.sub(r"const VERSION='v[0-9.]+';", "const VERSION='v2.61';", s)
          s=re.sub(r"const STAMP='[^']+';", f"const STAMP='{STAMP}';", s)
          s=s.replace('V260','V261').replace('v2.60','v2.61').replace('v=2.60','v=2.61')
          p.write_text(s)

          for fn in ['polar-intelligence-v222.js','workout-completion-v244.js','cardio-persistence-v245.js','home-dashboard-v227.js','ui-hotfix-v250.js','ui-final-v252.js','strength-polar-v253.js']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text()
              s=re.sub(r"const VERSION='v[0-9.]+';", "const VERSION='v2.61';", s)
              s=re.sub(r"const STAMP='[^']+';", f"const STAMP='{STAMP}';", s)
              s=s.replace('V260','V261').replace("'v2.60'", "'v2.61'").replace('?v=2.60','?v=2.61')
              p.write_text(s)
          PY

      - name: Commit release
        run: |
          git config user.name "Nexus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html nexus-config.js ana-progression-v260.js polar-intelligence-v222.js workout-completion-v244.js cardio-persistence-v245.js home-dashboard-v227.js ui-hotfix-v250.js ui-final-v252.js strength-polar-v253.js
          git commit -m "Apply Ana Lower B progression immediately v2.61" || exit 0
          git push origin main
