name: Release Nexus v2.62

on:
  push:
    paths:
      - '.github/workflows/release-v262.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v2.62 profile active isolation release
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION='v2.62'
          STAMP='12/09/2026 10:40:00'

          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'<title>Nexus Training v[^<]+</title>', f'<title>Nexus Training {VERSION}</title>', s)
          s=re.sub(r'<div class="version">Training - v[^<]+</div>', f'<div class="version">Training - {VERSION} ({STAMP})</div>', s)
          s=re.sub(r'nexus-config\.js\?v=[0-9.]+', 'nexus-config.js?v=2.62', s)
          s=re.sub(r'cloud-v27\.js\?v=[0-9.]+', 'cloud-v27.js?v=2.62', s)
          p.write_text(s)

          for p in Path('.').glob('*.js'):
              s=p.read_text()
              changed=False
              if 'v2.61' in s:
                  s=s.replace('v2.61','v2.62')
                  changed=True
              if 'V261' in s:
                  s=s.replace('V261','V262')
                  changed=True
              if "const STAMP='" in s and (changed or p.name=='nexus-config.js'):
                  s=re.sub(r"const STAMP='[^']+';", f"const STAMP='{STAMP}';", s)
                  changed=True
              if p.name=='nexus-config.js':
                  if 'loadProfileActiveIsolation' not in s:
                      anchor="  const loadFinalUi=()=>"
                      loader="  const loadProfileActiveIsolation=()=>load('profile-active-isolation-v262.js?v=2.62','data-nexus-profile-active-isolation','v2.62');\n"
                      s=s.replace(anchor,loader+anchor)
                  boot="  const boot=()=>{\n    installVersionLock();\n"
                  if boot in s and 'loadProfileActiveIsolation();' not in s.split(boot,1)[1].split('let n=0;',1)[0]:
                      s=s.replace(boot,boot+'    loadProfileActiveIsolation();\n',1)
                  changed=True
              if changed:
                  p.write_text(s)
          PY

      - name: Commit release
        run: |
          git config user.name "Nexus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html *.js
          git commit -m "Isolate active workouts by profile v2.62" || exit 0
          git push origin main
