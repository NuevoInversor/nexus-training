name: Release Nexus v2.58

on:
  push:
    paths:
      - '.github/workflows/release-v258.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Polar Spinning mapping and history visual
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          VERSION='v2.58'
          STAMP='07/09/2026 12:20:00'

          # Polar sport id 118 = Spinning for Nexus imports.
          p=Path('polar-intelligence-v222.js')
          s=p.read_text()
          if "if(id==='118')return'spinning';" not in s:
              s=s.replace("if(id==='63')return'step';\n    return'other';", "if(id==='63')return'step';\n    if(id==='118')return'spinning';\n    return'other';")
          p.write_text(s)

          # Spinning is cardio, so imported sessions get the subjective review flow.
          p=Path('cardio-report-v215.js')
          s=p.read_text()
          s=s.replace("'hike','elliptical'", "'hike','elliptical','spinning'")
          p.write_text(s)

          # Native history visual: reuse the bicycle SVG but give Spinning its own type/label/class.
          p=Path('index.html')
          s=p.read_text()
          if ".activity-chip.spinning{" not in s:
              s=s.replace(".activity-chip.bike{background:#ecfccb;color:#3f6212}", ".activity-chip.bike{background:#ecfccb;color:#3f6212}\n.activity-chip.spinning{background:#dbeafe;color:#1d4ed8}")
          if "spinning:{icon:'bike', cls:'spinning', label:'Spinning'}," not in s:
              s=s.replace("bike:{icon:'bike', cls:'bike', label:'Bicicleta'},", "bike:{icon:'bike', cls:'bike', label:'Bicicleta'},\n    spinning:{icon:'bike', cls:'spinning', label:'Spinning'},")

          # Release/cache busting on the real entry point.
          s=re.sub(r'<title>Nexus Training v[^<]+</title>', f'<title>Nexus Training {VERSION}</title>', s)
          s=re.sub(r'<div class="version">Training - v[^<]+</div>', f'<div class="version">Training - {VERSION} ({STAMP})</div>', s)
          s=re.sub(r'nexus-config\.js\?v=[0-9.]+', 'nexus-config.js?v=2.58', s)
          s=re.sub(r'cloud-v27\.js\?v=[0-9.]+', 'cloud-v27.js?v=2.58', s)
          p.write_text(s)

          # Central loader and cache keys.
          p=Path('nexus-config.js')
          s=p.read_text()
          s=re.sub(r"const VERSION='v[0-9.]+';", "const VERSION='v2.58';", s)
          s=re.sub(r"const STAMP='[^']+';", f"const STAMP='{STAMP}';", s)
          s=s.replace('V257','V258').replace('v2.57','v2.58').replace('v=2.57','v=2.58')
          p.write_text(s)

          # Keep version-writing/helper modules aligned.
          for fn in ['polar-intelligence-v222.js','workout-completion-v244.js','cardio-persistence-v245.js','home-dashboard-v227.js','ui-hotfix-v250.js','ui-final-v252.js','strength-polar-v253.js']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text()
              s=re.sub(r"const VERSION='v[0-9.]+';", "const VERSION='v2.58';", s)
              s=re.sub(r"const STAMP='[^']+';", f"const STAMP='{STAMP}';", s)
              s=s.replace('V257','V258').replace("'v2.57'", "'v2.58'").replace('?v=2.57','?v=2.58')
              p.write_text(s)
          PY

      - name: Commit release
        run: |
          git config user.name "Nexus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html nexus-config.js polar-intelligence-v222.js cardio-report-v215.js workout-completion-v244.js cardio-persistence-v245.js home-dashboard-v227.js ui-hotfix-v250.js ui-final-v252.js strength-polar-v253.js
          git commit -m "Identify Polar Spinning activities v2.58" || exit 0
          git push origin main
